<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ivory:#F5F0E6;--ivory2:#EBE4D4;--ink:#1D1E21;--anth:#222326;--anth2:#2C2E32;--anth3:#3A3C41;--goldT:#7A5F2B;--alert:#B82A16;--ok:#2B6548;--warn:#80530A;--muted:#66645F;--line:rgba(29,30,33,.16);

body{font-family:Inter,system-ui,-apple-system,sans-serif;background:radial-gradient(circle at 20% 10%,#E9E2D2,#CFC7B5 60%,#B9B09C);color:var(--ink);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
.serif{font-family:'Cormorant Garamond',Georgia,serif}
.stage{display:flex;gap:28px;justify-content:center;align-items:flex-start;padding:20px;min-height:100%}
.phone{--bg:var(--ivory);--fg:var(--ink);--card:#FBF8F1;--sub:var(--muted);--ln:var(--line);--accent:var(--goldT);

.buzz{animation:buzz .25s 3}

.hap{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--ln);border-radius:14px;font-size:13px;margin:10px 0}
.step3{display:grid;gap:8px}
.st{border:1.5px solid var(--ln);border-radius:16px;padding:12px;display:flex;gap:12px;align-items:flex-start}
.st.active{border-color:var(--accent);background:rgba(229,211,166,.1)}
.st.done{border-style:solid;border-color:#7CD3A4}
.st .n{width:28px;height:28px;border-radius:50%;border:1.5px solid currentColor;display:flex;align-items:center;justify-content:center;font-weight:600;flex:none;font-size:13px}
.mapbox{border-radius:18px;overflow:hidden;border:1px solid var(--ln);background:#E8E0CE}
.pin{cursor:pointer}.pin:focus{outline:none}.pin:focus circle.r,.pin:hover circle.r{stroke-width:4}
.bar{height:8px;border-radius:5px;background:var(--ln);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.prod{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{border:1px solid var(--ln);border-radius:18px;padding:10px;background:var(--card);min-width:0}.ill{position:absolute;left:8px;bottom:6px;font-size:10px;font-style:normal;color:var(--sub)}.ph{position:relative;overflow:hidden}.pimg{width:100%;height:100%;object-fit:cover;display:block}.ilw{background:rgba(251,248,241,.88);padding:2px 6px;border-radius:6px;color:#1D1E21}
.ph{aspect-ratio:1;border-radius:12px;background:radial-gradient(circle at 30% 25%,#FFFDF6,#EDE7D8);display:flex;align-items:center;justify-content:center;margin-bottom:8px;overflow:hidden}
.fin{width:36px;height:36px;border-radius:50%;border:2px solid transparent;outline:1px solid var(--ln);outline-offset:2px}.fin[aria-pressed=true]{border-color:var(--fg)}
.stepper{display:flex;gap:4px;margin:8px 0}
.stepper div{flex:1;text-align:center;font-size:10px;padding-top:6px;border-top:4px solid var(--ln);color:var(--sub)}
.stepper div.done{border-top-color:var(--accent);color:var(--fg)}
.stepper div.cur{border-top-color:var(--fg);color:var(--fg);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--ln);vertical-align:top}th{color:var(--sub);font-weight:600}
.modalwrap{position:fixed;inset:0;z-index:200;background:rgba(10,10,12,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#FBF8F1;color:#1D1E21;border-radius:22px;max-width:560px;width:100%;max-height:90vh;overflow-y:auto;padding:22px}
.modal h3{font-size:20px;margin-bottom:8px}.modal h4{margin:14px 0 4px;font-size:14px}.modal ul{padding-left:18px;font-size:14px}.modal li{margin:3px 0}.modal code{background:#EBE4D4;padding:1px 5px;border-radius:5px;font-size:12px}
.modal pre{background:#222326;color:#F1ECE0;padding:10px;border-radius:10px;font-size:12px;overflow-x:auto;margin:6px 0}
.fresh{animation:flash 1.2s 3}
@keyframes flash{50%{box-shadow:0 0 0 4px var(--alert)}}
.logo-ban{display:block;width:100%;height:auto;aspect-ratio:520/190;border-radius:16px;margin-top:6px}.logo-sm{display:block;height:40px;width:auto;aspect-ratio:520/190;border-radius:8px}
.phone[data-theme=khaki]{--bg:#4F5337;--fg:#F5F0E6;--card:#5E6342;--sub:#DAD4B6;--ln:rgba(216,196,147,.34);--accent:#E5D3A6}
.phone[data-theme=khaki] .btn:not(.gold):not(.alert):not(.ghost){background:#F5F0E6;color:#3E4029}

.phone[data-theme=olive] .chip.warn,.phone[data-theme=khaki] .chip.warn,.phone[data-theme=olive] .banner.warn,.phone[data-theme=khaki] .banner.warn,.phone[data-theme=olive] .loc.warn,.phone[data-theme=khaki] .loc.warn{color:#F0C46B;border-color:#F0C46B}
.phone[data-theme=olive] .chip.ok,.phone[data-theme=khaki] .chip.ok{color:#7CD3A4}
.phone[data-theme=olive] .chip.err,.phone[data-theme=khaki] .chip.err,.phone[data-theme=olive] .banner.err,.phone[data-theme=khaki] .banner.err{color:#FF9A88;border-color:#FF9A88}
.phone[data-theme=olive]{--bg:#4B4C30;--fg:#F4ECD6;--card:#585A3A;--sub:#D5CEAE;--ln:rgba(216,196,147,.32);--accent:#E5D3A6}

@keyframes pulse{0%,100%{transform:scale(.9);opacity:.55}50%{transform:scale(1.12);opacity:1}}
.cmap{border-radius:18px;overflow:hidden;border:1px solid var(--ln);background:#3E3F26}
.cmap .pin:focus circle.hit,.cmap .pin:hover circle.hit{stroke:#E5D3A6;stroke-width:2}

:root{--bg:#4F5337;--fg:#F5F0E6;--card:#5E6342;--sub:#DAD4B6;--ln:rgba(216,196,147,.34);--accent:#E5D3A6;--win:#43472D;--fld:#41452C;--line:rgba(216,196,147,.34);--muted:#DAD4B6;--ok:#7CD3A4;--warn:#F0C46B}

.tabbar{background:var(--win)}

<script>
"use strict";
/* ============ Utilitaires ============ */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const T0=Date.now(), BASE=18*3600+15*60;
const simSec=()=>BASE+Math.floor((Date.now()-T0)/1000);
const evSec=()=>simSec()+5*3600; // horloge de la console (soirée)
const hm=s=>pad(Math.floor((s%86400)/3600))+':'+pad(Math.floor((s%3600)/60));
const hms=s=>hm(s)+':'+pad(s%60);
let uidn=100;const uid=p=>p+(++uidn);

/* ============ Icônes ============ */

 return `<div class="gauge" role="img" aria-label="Batterie ${pct} pour cent${low?', faible':''}"><svg width="84" height="84" viewBox="0 0 84 84"><circle cx="42" cy="42" r="${r}" fill="none" stroke="var(--ln)" stroke-width="6"/><circle cx="42" cy="42" r="${r}" fill="none" stroke="${low?'var(--alert)':'var(--accent)'}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${c*pct/100} ${c}" transform="rotate(-90 42 42)" ${low?'stroke-dashoffset="0"':''}/></svg><b>${pct}%</b></div>`;
}

function shortView(f){

 const cancel=f.cancelLeft>0&&['sending','sent'].includes(a.status)?`<button class="btn ghost" data-a="cancelAlert">Appui accidentel ? Annuler (${f.cancelLeft} s)</button>`:'';
 if(a.status==='sending') h+=`<div class="spin" aria-hidden="true"></div><h1 class="serif" style="text-align:center" role="status">Envoi en cours…</h1><p class="sub" style="text-align:center;margin-top:6px">Restez où vous êtes en sécurité. Vous pouvez encore annuler.</p>${hapLine()}${cancel}`;
 else if(a.status==='sent'){
  const msg=a.test?'Test réussi. Aucun destinataire réel n’a été notifié.':!a.zone?'Envoyée sans position. Aucun aidant proche n’a pu être ciblé. Vos 2 contacts de confiance sont prévenus.':`${a.helpers} aidants volontaires ont été prévenus. Ils voient seulement une zone approximative.`;
  h+=`<div class="badge ok">${ic('check',44)}</div><h1 class="serif" style="text-align:center" role="status">Alerte reçue par N.A.E.</h1><p style="text-align:center;margin-top:6px">${msg}</p>${hapLine()}

 } else if(a.status==='failed') h+=`<div class="badge err">${ic('x',44)}</div><h1 class="serif" style="text-align:center" role="alert">Échec d’envoi</h1><p style="text-align:center;margin-top:6px"><b>Votre alerte n’a pas été transmise.</b> Aucun aidant n’a été prévenu.${state.sim.network?' Réseau indisponible.':''}</p>${hapLine()}<button class="btn gold" data-a="retry" data-id="${a.id}">${ic('refresh',18)} Réessayer l’envoi</button><button class="btn alert" data-a="callpick">${ic('phone',18)} Appeler le 112 (simulé)</button><button class="btn ghost" data-a="closeFlow">Fermer</button>`;
 else if(a.status==='cancelled') h+=`<div class="badge mut">${ic('x',44)}</div><h1 class="serif" style="text-align:center" role="status">Alerte annulée</h1><p style="text-align:center;margin-top:6px">Les aidants déjà prévenus reçoivent un message d’annulation.</p>${hapLine()}<button class="btn" data-a="closeFlow">Fermer</button>`;

}

 <button class="btn ghost" data-a="closeFlow">Terminer</button>`;
 return h;
}

function base(role){clearFlowsHard();state.onboarded=true;state.session=state.session||'guest';state.scenario=state.scenario;setRole(role)}

/* ============ Actions métier ============ */
function setRole(r){state.role=r;state.tab='home';state.agentTab='alerts';state.sheet=null;state.notif=null;state.callPick=false;if(r==='agent'&&state.agentView!=='lina'&&!state.scenario)state.agentView='lina'}
function clearFlowsHard(){state.flow=null;state.call=null;state.callPick=false;state.sheet=null;state.notif=null;clearInterval(cancelTimer);clearInterval(callTimer)}
function closeFlowNow(){state.flow=null;clearInterval(cancelTimer)}
function pressJewel(kind){
 if(state.flow||state.call||!state.onboarded&&!state.onbTestAllowed)return;
 if(state.sim.ble){state.flow={type:'notx'};haptic('fail');render();return}
 kind==='long'?A.long():A.short();
}
function newAlert(kind){
 const z=zoneFor();
 const a={id:uid('A'),kind,mine:true,test:state.testMode||(!state.onboarded),status:'sending',ts:simSec(),zone:z,helpers:0,responders:0};
 state.alerts.unshift(a);return a;
}
function startCancelTimer(){
 clearInterval(cancelTimer);
 cancelTimer=setInterval(()=>{const f=state.flow;if(!f||!(f.cancelLeft>0)){clearInterval(cancelTimer);return}f.cancelLeft--;if(f.cancelLeft<=0)clearInterval(cancelTimer);render()},1000);
}
function completeSend(a){
 if(!a||a.status!=='sending')return;
 if(state.sim.network){a.status='failed';haptic('fail')}
 else{a.status='sent';a.helpers=a.test||!a.zone?0:Math.max(1,Math.round(state.prefs.radius/125));if(a.zone&&!a.test&&state.prefs.helper===false){}haptic(a.kind==='long'?'received':'received');}
 render();
}
function forceSend(){const a=state.alerts.find(x=>x.mine&&x.status==='sending');if(a)completeSend(a)}
function startCall(num){
 state.callPick=false;state.call={num,sec:0};
 if(state.flow&&state.flow.type==='long')state.flow.call='active';
 clearInterval(callTimer);callTimer=setInterval(()=>{if(state.call){state.call.sec++;render()}},1000);
}
function hangup(){
 state.call=null;clearInterval(callTimer);
 if(state.flow&&state.flow.type==='long')state.flow.call='ended';
}

/* Appui maintenu sur le bouton du bijou */
let hold=null;
document.addEventListener('pointerdown',e=>{
 const el=e.target.closest('[data-hold]');if(!el)return;
 hold={t:performance.now(),done:false,raf:0};
 const step=()=>{if(!hold)return;const p=Math.min(1,(performance.now()-hold.t)/2000);const r=$('#holdring');if(r)r.style.strokeDashoffset=String(490*(1-p));
  if(p>=1&&!hold.done){hold.done=true;pressJewel('long');render();return}
  hold.raf=requestAnimationFrame(step)};
 step();
});
function endHold(){
 if(!hold)return;const h=hold;hold=null;cancelAnimationFrame(h.raf);const r=$('#holdring');if(r)r.style.strokeDashoffset='490';
 if(!h.done&&performance.now()-h.t<2000){pressJewel('short');render()}
}
document.addEventListener('pointerup',endHold);document.addEventListener('pointercancel',()=>{if(hold){cancelAnimationFrame(hold.raf);hold=null}});
